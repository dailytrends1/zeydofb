<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok Daily Free Followers Hub</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#ffffff;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.container{
width:100%;
max-width:450px;
text-align:center;
}

.top-title{
font-size:15px;
font-weight:900;
text-transform:uppercase;
background:linear-gradient(90deg,#25F4EE,#FE2C55);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
margin-bottom:15px;
letter-spacing:1px;
}

.logo{
margin-bottom:15px;
}

.logo img{
width:90px;
height:auto;
}

.card{
background:#fff;
padding:25px;
border-radius:20px;
border:2px solid #f2f2f2;
box-shadow:0 8px 25px rgba(0,0,0,0.08);
}

h1{
font-size:28px;
color:#111;
margin-bottom:10px;
}

.description{
font-size:15px;
color:#555;
line-height:1.5;
margin-bottom:25px;
}

.counter{
font-size:42px;
font-weight:900;
color:#25F4EE;
margin-bottom:20px;
}

.slider-wrap{
margin-bottom:20px;
}

input[type=range]{
width:100%;
height:10px;
cursor:pointer;
accent-color:#FE2C55;
}

.success{
display:none;
background:#f8f9fa;
border:2px solid #25F4EE;
padding:15px;
border-radius:12px;
margin-bottom:15px;
color:#111;
font-weight:bold;
}

.btn{
display:none;
width:100%;
padding:16px;
border:none;
border-radius:12px;
background:linear-gradient(90deg,#25F4EE,#FE2C55);
color:#fff;
font-size:18px;
font-weight:900;
text-decoration:none;
transition:0.3s;
}

.btn:hover{
transform:scale(1.02);
}

.live{
margin-top:15px;
font-size:14px;
color:#666;
}

.dot{
display:inline-block;
width:8px;
height:8px;
background:#22c55e;
border-radius:50%;
margin-right:5px;
animation:pulse 1s infinite;
}

.footer{
margin-top:15px;
font-size:12px;
color:#777;
}

@keyframes pulse{
0%{opacity:1;}
50%{opacity:.3;}
100%{opacity:1;}
}

@media(max-width:480px){

.card{
padding:20px;
}

.logo img{
width:75px;
}

.top-title{
font-size:13px;
}

h1{
font-size:24px;
}

.counter{
font-size:34px;
}

.description{
font-size:14px;
}

.btn{
font-size:16px;
}

}
</style>
</head>
<body>

<div class="container">

<div class="top-title">
TIKTOK DAILY FREE FOLLOWERS HUB
</div>

<div class="logo">
<img src="https://upload.wikimedia.org/wikipedia/en/a/a9/TikTok_logo.svg" alt="TikTok">
</div>

<div class="card">

<h1>Choose Followers</h1>

<p class="description">
Drag the slider below to choose the number of followers you want.
</p>

<div class="counter" id="followers">
500
</div>

<div class="slider-wrap">
<input
type="range"
id="slider"
min="500"
max="10000"
step="500"
value="500">
</div>

<div class="success" id="success">
🎉 Congratulations! Continue to add your followers.
</div>

<a href="https://ln.run/Kro_f" class="btn" id="continueBtn">
CONTINUE →
</a>

<div class="live">
<span class="dot"></span>
<span id="users">1,247</span> users claimed followers today
</div>

</div>

<div class="footer">
Follower availability may vary.
</div>

</div>

<script>
const slider = document.getElementById('slider');
const followers = document.getElementById('followers');
const success = document.getElementById('success');
const continueBtn = document.getElementById('continueBtn');

slider.addEventListener('input', function(){

followers.innerText =
Number(this.value).toLocaleString();

if(this.value > 500){
success.style.display = 'block';
continueBtn.style.display = 'block';
}

});

let users = 1247;

setInterval(() => {

users += Math.floor(Math.random() * 4);

document.getElementById('users').innerText =
users.toLocaleString();

},3000);
</script>

</body>
</html>
