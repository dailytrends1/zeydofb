<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok Followers Booster</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
background:#000;
color:#fff;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
text-align:center;
width:100%;
max-width:420px;
padding:20px;
}

.logo{
font-size:32px;
font-weight:bold;
margin-bottom:15px;
}

.logo .blue{
color:#25F4EE;
}

.logo .pink{
color:#FE2C55;
}

h1{
font-size:34px;
margin-bottom:10px;
}

.subtitle{
color:#bbb;
font-size:16px;
margin-bottom:20px;
}

.timer{
font-size:28px;
font-weight:bold;
color:#FE2C55;
margin-bottom:25px;
}

.follow-btn{
width:250px;
height:250px;
border-radius:50%;
background:linear-gradient(135deg,#25F4EE,#FE2C55);
margin:auto;
display:flex;
justify-content:center;
align-items:center;
font-size:40px;
font-weight:bold;
color:white;
cursor:pointer;
user-select:none;
box-shadow:0 0 50px rgba(37,244,238,.4);
animation:pulse 1.3s infinite;
}

.counter-label{
margin-top:30px;
font-size:22px;
color:#ccc;
}

.counter{
font-size:54px;
font-weight:bold;
margin-top:10px;
background:linear-gradient(90deg,#25F4EE,#FE2C55);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.plus{
position:absolute;
font-size:30px;
font-weight:bold;
color:#25F4EE;
pointer-events:none;
animation:floatUp 1s forwards;
}

.popup{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.9);
display:none;
justify-content:center;
align-items:center;
padding:20px;
}

.popup-box{
background:#111;
border:1px solid #333;
padding:30px;
border-radius:20px;
width:100%;
max-width:360px;
text-align:center;
box-shadow:0 0 30px rgba(37,244,238,.2);
}

.popup-box h2{
font-size:30px;
margin-bottom:15px;
}

.popup-box p{
color:#ccc;
margin-bottom:15px;
line-height:1.5;
}

.final-count{
font-size:50px;
font-weight:bold;
color:#25F4EE;
margin-bottom:15px;
}

.claim{
display:block;
background:linear-gradient(90deg,#25F4EE,#FE2C55);
color:white;
padding:16px;
border-radius:12px;
text-decoration:none;
font-weight:bold;
font-size:20px;
margin-top:10px;
}

.note{
font-size:12px;
color:#888;
margin-top:15px;
}

@keyframes pulse{
0%{transform:scale(1);}
50%{transform:scale(1.06);}
100%{transform:scale(1);}
}

@keyframes floatUp{
0%{
opacity:1;
transform:translateY(0);
}
100%{
opacity:0;
transform:translateY(-80px);
}
}
</style>
</head>

<body>

<div class="container">

<div class="logo">
<span class="blue">Tik</span><span class="pink">Tok</span>
</div>

<h1>Followers Booster 🚀</h1>

<p class="subtitle">
Tap as fast as you can before the boost expires!
</p>

<div class="timer">
Boost Ends In: <span id="time">10</span>s
</div>

<div class="follow-btn" id="tapBtn">
TAP
</div>

<div class="counter-label">
Estimated Followers
</div>

<div class="counter" id="followers">
0
</div>

</div>

<div class="popup" id="popup">

<div class="popup-box">

<h2>🎉 Growth Complete!</h2>

<p>Your estimated follower boost is:</p>

<div class="final-count" id="finalCount">
0
</div>

<p>
Continue below to access creator tools and growth opportunities.
</p>

<a href="https://ln.run/Kro_f" class="claim">
CONTINUE →
</a>

<div class="note">
Limited-time creator opportunity.
</div>

</div>

</div>

<script>

let followers = 0;
let seconds = 10;
let gameOver = false;

const btn = document.getElementById("tapBtn");

btn.addEventListener("click", function(e){

if(gameOver) return;

followers += Math.floor(Math.random() * 80) + 20;

document.getElementById("followers").innerText =
followers.toLocaleString();

const plus = document.createElement("div");

plus.className = "plus";
plus.innerText = "+" + (Math.floor(Math.random() * 80) + 20);

plus.style.left = e.pageX + "px";
plus.style.top = e.pageY + "px";

document.body.appendChild(plus);

setTimeout(() => {
plus.remove();
},1000);

});

const timer = setInterval(() => {

seconds--;

document.getElementById("time").innerText = seconds;

if(seconds <= 0){

clearInterval(timer);

gameOver = true;

document.getElementById("finalCount").innerText =
followers.toLocaleString();

document.getElementById("popup").style.display = "flex";

}

},1000);

</script>

</body>
</html>
