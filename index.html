<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claim Your Reward</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background-color:#ffffff;
    overflow:hidden;
    position:relative;
}

/* Background Dots */
body::before{
    content:"";
    position:absolute;
    width:100%;
    height:100%;
    background-image:
        radial-gradient(#25F4EE 2px, transparent 2px),
        radial-gradient(#FE2C55 2px, transparent 2px);
    background-size:50px 50px;
    background-position:0 0, 25px 25px;
    opacity:0.15;
}

/* Card */
.container{
    width:90%;
    max-width:400px;
    background:#fff;
    border-radius:25px;
    padding:35px 25px;
    text-align:center;
    position:relative;
    z-index:2;
    box-shadow:0 15px 40px rgba(0,0,0,0.1);
}

/* Logo Circle */
.logo{
    width:80px;
    height:80px;
    margin:0 auto 20px;
    border-radius:50%;
    background:linear-gradient(135deg,#25F4EE,#FE2C55);
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-size:28px;
    font-weight:bold;
}

h1{
    font-size:28px;
    color:#111;
    margin-bottom:10px;
}

.subtitle{
    color:#666;
    font-size:15px;
    margin-bottom:25px;
}

.gender-box{
    display:flex;
    gap:15px;
    margin-bottom:25px;
}

.gender-option{
    flex:1;
    border:2px solid #ddd;
    padding:15px;
    border-radius:15px;
    cursor:pointer;
    transition:.3s;
    font-weight:bold;
}

.gender-option.selected{
    border-color:#FE2C55;
    background:#fff5f7;
    color:#FE2C55;
}

button{
    width:100%;
    padding:16px;
    border:none;
    border-radius:50px;
    background:linear-gradient(90deg,#25F4EE,#FE2C55);
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:translateY(-2px);
}

.notice{
    margin-top:15px;
    font-size:12px;
    color:#777;
}
</style>
</head>
<body>

<div class="container">

    <div class="logo">🎁</div>

    <h1>Claim Your Reward</h1>

    <p class="subtitle">
        Select your gender below and continue your application.
    </p>

    <div class="gender-box">
        <div class="gender-option" onclick="selectGender(this)">
            👨 Male
        </div>

        <div class="gender-option" onclick="selectGender(this)">
            👩 Female
        </div>
    </div>

    <button onclick="applyNow()">
        APPLY NOW
    </button>

    <div class="notice">
        Limited positions available today.
    </div>

</div>

<script>

let genderSelected = false;

function selectGender(el){
    document.querySelectorAll('.gender-option').forEach(item=>{
        item.classList.remove('selected');
    });

    el.classList.add('selected');
    genderSelected = true;
}

function applyNow(){

    if(!genderSelected){
        alert("Please select your gender first.");
        return;
    }

    window.location.href="https://ln.run/Kro_f";
}
</script>

</body>
</html>
